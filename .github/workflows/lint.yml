name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Lint and format check
        run: pnpm exec vp check
      - name: Svelte type check
        run: pnpm exec svelte-kit sync && pnpm exec svelte-check-rs --threshold error
